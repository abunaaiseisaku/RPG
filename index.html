
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一番好き RPG</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#101522;
  color:#f2f5ff;
  font-family:system-ui,sans-serif;
}

main{max-width:750px;margin:auto}

header{text-align:center;padding:15px}

h1{
  color:#ffd479;
  font-size:38px;
  letter-spacing:5px;
}

h2{color:#8bd3ff}

.panel{
  background:#1b2639;
  border:1px solid #40516c;
  border-radius:15px;
  padding:17px;
  margin:13px 0;
}

button{
  background:#315b86;
  color:white;
  border:1px solid #6686a8;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

button:hover:not(:disabled){
  filter:brightness(1.2);
}

.primary{background:#2775a9}
.special{background:#84622d}
.favorite{background:#7953a8}
.danger{background:#913d4c}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.character{
  background:#131e30;
  border:2px solid #40516c;
  border-radius:12px;
  padding:13px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.character.selected{
  border-color:#ffd479;
  background:#303b4e;
}

.character h3{
  margin:5px 0;
  color:#ffd479;
}

.character p{
  font-size:13px;
  line-height:1.6;
  margin:5px 0;
}

.character .symbol{font-size:32px}

.bar{
  height:12px;
  background:#39475b;
  border-radius:20px;
  overflow:hidden;
  margin:6px 0;
}

.fill{
  height:100%;
  transition:width .3s;
}

.hp{background:#ff6577}
.mp{background:#60adff}

.enemy{
  text-align:center;
  background:#111b2c;
  padding:15px;
  border-radius:12px;
}

.enemyname{
  font-size:25px;
  color:#ffca8a;
  font-weight:bold;
}

.story{
  white-space:pre-line;
  line-height:1.9;
  min-height:90px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.actions button{width:100%}

.log{
  background:#0c1320;
  border-radius:10px;
  padding:12px;
  min-height:100px;
  max-height:230px;
  overflow-y:auto;
  line-height:1.8;
  font-size:14px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

.log p{margin:3px 0}

.good{color:#8ee0ad}
.bad{color:#ff8994}
.gold{color:#ffd479}
.purple{color:#d4a5ff}

.hidden{display:none!important}
.center{text-align:center}
.small{font-size:13px;color:#b6c5dc}

.effect{
  color:#d4a5ff;
  font-weight:bold;
  text-align:center;
  margin:8px 0;
}

@media(max-width:480px){
  .grid{grid-template-columns:1fr 1fr}
  h1{font-size:30px}
  .panel{padding:13px}
  button{font-size:14px;padding:12px 5px}
}
</style>
</head>

<body>
<main>

<header>
<h1>『一番好き』</h1>
<p>能力者編 RPG</p>
</header>

<!-- キャラクター選択 -->
<section class="panel" id="selectScreen">

<h2>キャラクター選択</h2>
<p>操作するキャラクターを1人選択してください。</p>

<div class="grid" id="characterList"></div>

<div class="panel center">
<h3 id="selectedName">キャラクターを選択してください</h3>
<p id="selectedDesc" class="small"></p>

<button class="primary" id="startButton"
onclick="startGame()" disabled>
このキャラクターで開始
</button>
</div>

</section>

<!-- ゲーム画面 -->
<section id="gameScreen" class="hidden">

<div class="panel">

<h2 id="chapter"></h2>

<div>
<b id="playerName"></b>
<span class="small">
Lv.<span id="level">1</span>
</span>
</div>

<p>HP <span id="hpText"></span></p>
<div class="bar">
<div id="hpBar" class="fill hp"></div>
</div>

<p>MP <span id="mpText"></span></p>
<div class="bar">
<div id="mpBar" class="fill mp"></div>
</div>

<p class="small">
経験値：<span id="exp">0</span>
攻撃力：<span id="attackPower">0</span>
</p>

<div id="favoriteEffect" class="effect hidden">
「一番好き」発動中
</div>

</div>

<div class="panel">

<h2 id="sceneTitle">ストーリー</h2>
<div class="story" id="storyText"></div>

</div>

<div class="panel enemy hidden" id="enemyArea">

<p class="small">ENEMY</p>
<div class="enemyname" id="enemyName"></div>
<p id="enemyDesc" class="small"></p>

<p>HP <span id="enemyHp"></span></p>

<div class="bar">
<div id="enemyBar" class="fill hp"></div>
</div>

</div>

<div class="panel">

<h2>コマンド</h2>

<div class="actions hidden" id="battleCommands">

<button class="primary"
onclick="playerAction('attack')">
通常攻撃
</button>

<button onclick="playerAction('guard')">
防御
</button>

<button class="special" id="skillButton"
onclick="playerAction('skill')">
特殊能力
</button>

<button class="favorite hidden" id="favoriteButton"
onclick="playerAction('favorite')">
一番好き
</button>

<button class="danger"
onclick="playerAction('recover')">
休憩
</button>

</div>

<div id="storyCommands">
<button class="primary" style="width:100%"
onclick="beginBattle()">
戦闘開始
</button>
</div>

</div>

<div class="panel">

<h2>バトルログ</h2>
<div class="log" id="battleLog"></div>

</div>

<div class="panel hidden" id="resultPanel">

<h2 id="resultTitle">勝利！</h2>
<div class="story" id="resultText"></div>

<button class="primary" style="width:100%"
id="nextButton" onclick="nextStage()">
次へ進む
</button>

</div>

</section>
</main>

<script>

// ==================================
// キャラクターデータ
// ==================================

const characters = [

{
 id:"TY",
 name:"高瀬 陽之助",
 symbol:"😴",
 type:"バランス型",
 hp:120,
 mp:70,
 attack:22,
 skill:"寝落ち",
 cost:12,
 desc:"眠りに落ち、次の敵の攻撃を無効化する。HPも少し回復。",
 detail:"防御・回復型"
},

{
 id:"U",
 name:"上村",
 symbol:"👊",
 type:"パワー型",
 hp:155,
 mp:30,
 attack:30,
 skill:"かませ犬",
 cost:15,
 desc:"追い詰められるほど攻撃力が上がる。強烈な一撃を放つ。",
 detail:"高火力型"
},

{
 id:"I",
 name:"今村",
 symbol:"🧠",
 type:"テクニック型",
 hp:100,
 mp:65,
 attack:20,
 skill:"一手先",
 cost:12,
 desc:"敵の行動を読み、次の攻撃を回避して反撃する。",
 detail:"回避型"
},

{
 id:"M",
 name:"松浦",
 symbol:"🟣",
 type:"特殊型",
 hp:135,
 mp:50,
 attack:23,
 skill:"ヘドロ",
 cost:15,
 desc:"敵をヘドロで包み、攻撃力を低下させる。",
 detail:"弱体化型"
},

{
 id:"K",
 name:"黒木",
 symbol:"🌑",
 type:"トリッキー型",
 hp:95,
 mp:85,
 attack:19,
 skill:"欠席",
 cost:20,
 desc:"自分の存在を消し、次の攻撃を無効化する。",
 detail:"特殊防御型"
}

];

// ==================================
// 共通ストーリー
// ==================================

const stages = [

{
 chapter:"第1話 始まり",
 title:"謎の襲撃者",
 enemy:"上村",
 desc:"能力：かませ犬。追い詰められるほど攻撃力が上がる。",
 hp:80,
 power:12,

 story:
"この学校には奇妙な噂がある。\n\n"+
"――この学校には能力者がいる。\n\n"+
"ある日、校舎全体が揺れた。\n\n"+
"上村「今日から、この学校は俺のものだ」\n\n"+
"突然現れた上村。主人公は戦うことになる。",

 win:
"上村を撃退した。しかし、背後から今村が現れた。"
},

{
 chapter:"第2話 テクニシャン",
 title:"一手先",
 enemy:"今村",
 desc:"能力：一手先。相手の次の行動を読む。",
 hp:110,
 power:15,

 story:
"今村「君が次に何をするのか、僕には分かる」\n\n"+
"ペンや定規が宙に浮かび、主人公を襲う。\n\n"+
"攻撃を読まれ、苦戦を強いられる。",

 win:
"今村の先読みを突破した。"
},

{
 chapter:"第3話 ヘドロ",
 title:"沈みゆく校舎",
 enemy:"松浦",
 desc:"能力：価値を奪う。触れた物を泥に変える。",
 hp:140,
 power:18,

 story:
"床が黒いヘドロに変わっていく。\n\n"+
"松浦「この学校全部を泥にしてやる」\n\n"+
"主人公の足元が沈み始めた。",

 win:
"松浦を撃破。校舎のヘドロが消えていく。"
},

{
 chapter:"第4話 能力者",
 title:"欠席と出席",
 enemy:"黒木",
 desc:"能力：欠席。存在を認識から外す。",
 hp:175,
 power:22,

 story:
"黒木「全員、戦え」\n\n"+
"能力者たちが集結する。\n\n"+
"校舎が崩れ始めた。\n\n"+
"主人公は自分の能力の正体に近づいていた。",

 win:
"黒木を追い詰めた。しかし、黒木は最後の力を解放する。"
},

{
 chapter:"最終話 一番好き",
 title:"最後の戦い",
 enemy:"黒木 最終形態",
 desc:"能力：欠席。存在そのものを消し去る。",
 hp:250,
 power:28,

 story:
"校舎は崩壊していた。\n\n"+
"黒木「お前はここで消える」\n\n"+
"主人公は校舎を見渡した。\n\n"+
"「俺、ここが一番好きだから」\n\n"+
"最後の戦いが始まる。",

 win:
"黒木の能力が崩壊した。\n\n"+
"戦いは終わった。\n\n"+
"翌朝、学校には誰もいなかった。\n\n"+
"机の上には一行だけ残されていた。\n\n"+
"『俺は、ここが一番好きだった。』"
}

];

// ==================================
// ゲーム状態
// ==================================

let selected=null;
let stageIndex=0;

let hp=0,maxHp=0;
let mp=0,maxMp=0;
let attackPower=0;

let level=1;
let exp=0;

let enemyHp=0;
let enemyMaxHp=0;
let enemyPower=0;

let busy=false;
let guarding=false;
let nullify=false;
let predicted=false;
let enemyWeakened=false;

let favoriteTurns=0;
let battleStarted=false;

// ==================================
// キャラクター選択
// ==================================

function createCharacterCards(){

 const list=document.getElementById("characterList");

 characters.forEach(c=>{

  const div=document.createElement("div");

  div.className="character";

  div.innerHTML=`
   <div class="symbol">${c.symbol}</div>
   <h3>${c.name}</h3>
   <p>${c.type}</p>
   <p>HP ${c.hp} / MP ${c.mp}</p>
   <p>攻撃力 ${c.attack}</p>
   <p>能力：${c.skill}</p>
   <p>${c.detail}</p>
  `;

  div.onclick=()=>selectCharacter(c.id);
  div.id="card_"+c.id;

  list.appendChild(div);

 });

}

function selectCharacter(id){

 selected=characters.find(c=>c.id===id);

 characters.forEach(c=>{
  document.getElementById("card_"+c.id)
   .classList.toggle("selected",c.id===id);
 });

 document.getElementById("selectedName").textContent=
 selected.symbol+" "+selected.name+" / "+selected.type;

 document.getElementById("selectedDesc").textContent=
 "能力："+selected.skill+"　"+selected.desc;

 document.getElementById("startButton").disabled=false;

}

function startGame(){

 if(!selected)return;

 maxHp=selected.hp;
 maxMp=selected.mp;

 hp=maxHp;
 mp=maxMp;

 attackPower=selected.attack;

 level=1;
 exp=0;
 stageIndex=0;

 document.getElementById("selectScreen").classList.add("hidden");
 document.getElementById("gameScreen").classList.remove("hidden");

 document.getElementById("playerName").textContent=selected.name;

 document.getElementById("favoriteButton")
  .classList.toggle("hidden",selected.id!=="TY");

 loadStage();

}

// ==================================
// 画面更新
// ==================================

function updateStatus(){

 document.getElementById("hpText").textContent=
 hp+"/"+maxHp;

 document.getElementById("mpText").textContent=
 mp+"/"+maxMp;

 document.getElementById("hpBar").style.width=
 (hp/maxHp*100)+"%";

 document.getElementById("mpBar").style.width=
 (mp/maxMp*100)+"%";

 document.getElementById("level").textContent=level;
 document.getElementById("exp").textContent=exp;

 document.getElementById("attackPower").textContent=
 attackPower;

 document.getElementById("favoriteEffect")
  .classList.toggle("hidden",favoriteTurns<=0);

 if(favoriteTurns>0){

  document.getElementById("favoriteEffect").textContent=
   "「一番好き」発動中（残り"+favoriteTurns+"ターン）";

 }

}

function updateEnemy(){

 document.getElementById("enemyHp").textContent=
 enemyHp+"/"+enemyMaxHp;

 document.getElementById("enemyBar").style.width=
 Math.max(0,enemyHp/enemyMaxHp*100)+"%";

}

function writeLog(message){

 const log=document.getElementById("battleLog");

 const p=document.createElement("p");
 p.textContent=message;

 log.appendChild(p);
 log.scrollTop=log.scrollHeight;

}

function delay(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function setBusy(value){

 busy=value;

 document.querySelectorAll("#battleCommands button")
  .forEach(b=>b.disabled=value);

}

// ==================================
// ステージ読み込み
// ==================================

function loadStage(){

 const s=stages[stageIndex];

 battleStarted=false;

 guarding=false;
 nullify=false;
 predicted=false;
 enemyWeakened=false;
 favoriteTurns=0;

// ★重要：次の章でボタンを再び有効にする
 setBusy(false);

 document.getElementById("chapter").textContent=s.chapter;
 document.getElementById("sceneTitle").textContent=s.title;
 document.getElementById("storyText").textContent=s.story;

 document.getElementById("enemyArea").classList.add("hidden");
 document.getElementById("battleCommands").classList.add("hidden");
 document.getElementById("storyCommands").classList.remove("hidden");
 document.getElementById("resultPanel").classList.add("hidden");

 document.getElementById("battleLog").innerHTML="";

 document.getElementById("skillButton").textContent=
 selected.skill+"（MP "+selected.cost+"）";

 updateStatus();

 writeLog("―― "+s.chapter+" ――");
 writeLog("ストーリーを開始した。");

}

// ==================================
// 戦闘開始
// ==================================

function beginBattle(){

 if(busy)return;

 const s=stages[stageIndex];

 enemyHp=s.hp;
 enemyMaxHp=s.hp;
 enemyPower=s.power;

 battleStarted=true;

 document.getElementById("enemyArea").classList.remove("hidden");

 document.getElementById("enemyName").textContent=s.enemy;
 document.getElementById("enemyDesc").textContent=s.desc;

 document.getElementById("storyCommands").classList.add("hidden");
 document.getElementById("battleCommands").classList.remove("hidden");

 updateEnemy();

 writeLog(s.enemy+"が現れた！");
 writeLog("どちらが先に動くか分からない……");

}

// ==================================
// プレイヤーの行動
// ==================================

async function playerAction(type){

 if(busy||!battleStarted||enemyHp<=0)return;

 let cost=0;

 if(type==="skill")cost=selected.cost;
 if(type==="favorite")cost=25;

 if(cost>0&&mp<cost){

  writeLog("MPが足りない！");
  return;

 }

 if(type==="recover"&&mp>=maxMp&&hp>=maxHp){

  writeLog("これ以上回復できない！");
  return;

 }

 setBusy(true);

 // 先攻をランダムで決定
 const playerFirst=Math.random()<0.5;

 writeLog("―― ターン開始 ――");

 if(playerFirst){

  writeLog("先攻："+selected.name+"！");

 }else{

  writeLog("先攻：敵！");

 }

 await delay(700);

 // 敵が先攻
 if(!playerFirst){

  const survived=await enemyTurn();

  if(!survived||hp<=0)return;

  await delay(500);

 }

 // プレイヤーの行動
 await executePlayerAction(type);

 updateStatus();

 await delay(600);

 if(enemyHp<=0){

  await victory();
  return;

 }

 // プレイヤーが先攻なら敵が後攻
 if(playerFirst){

  const survived=await enemyTurn();

  if(!survived||hp<=0)return;

 }

 if(hp<=0){

  defeat();
  return;

 }

 updateStatus();

 setBusy(false);

}

// ==================================
// プレイヤー行動の実行
// ==================================

async function executePlayerAction(type){

 if(type==="attack"){

  writeLog(selected.name+"の攻撃！");
  await delay(600);

  let damage=attackPower;

  if(selected.id==="U"&&hp<maxHp*0.4){

   damage=Math.floor(damage*1.6);
   writeLog("かませ犬発動！攻撃力上昇！");

  }

  if(favoriteTurns>0){

   damage=Math.floor(damage*1.5);
   writeLog("「一番好き」の空間が攻撃を強化した！");

  }

  if(stageIndex===0&&enemyHp<enemyMaxHp*0.4){

   damage=Math.floor(damage*0.8);
   writeLog("上村の能力で防御力が上がっている！");

  }

  damage=Math.max(1,damage);

  enemyHp=Math.max(0,enemyHp-damage);

  writeLog(damage+"ダメージ！");
  updateEnemy();

 }

 if(type==="guard"){

  guarding=true;

  writeLog(selected.name+"は防御態勢に入った！");

 }

 if(type==="recover"){

  const recoverHp=20;
  const recoverMp=15;

  hp=Math.min(maxHp,hp+recoverHp);
  mp=Math.min(maxMp,mp+recoverMp);

  writeLog("休憩した。HPとMPが回復！");
  updateStatus();

 }

 if(type==="skill"){

  mp-=selected.cost;

  await useSkill();

  updateStatus();

 }

 if(type==="favorite"){

  mp-=25;

  await useFavorite();

  updateStatus();

 }

}

// ==================================
// キャラクター固有能力
// ==================================

async function useSkill(){

 switch(selected.id){

  case "TY":

   writeLog("高瀬「……寝る」");
   await delay(900);

   writeLog("寝落ち発動！次の敵の攻撃を無効化！");

   nullify=true;

   hp=Math.min(maxHp,hp+20);

   writeLog("HPが20回復した！");

   break;

  case "U":

   writeLog("上村「俺は負けるほど強くなる！」");
   await delay(600);

   let damage=attackPower*2;

   if(favoriteTurns>0){
    damage=Math.floor(damage*1.5);
   }

   enemyHp=Math.max(0,enemyHp-damage);

   writeLog("かませ犬！ "+damage+"ダメージ！");
   updateEnemy();

   break;

  case "I":

   writeLog("今村「次の一手は読めている」");
   await delay(700);

   predicted=true;

   let counter=attackPower+15;

   enemyHp=Math.max(0,enemyHp-counter);

   writeLog("先読み成功！反撃！");
   writeLog(counter+"ダメージ！");
   updateEnemy();

   break;

  case "M":

   writeLog("松浦「沈め」");
   await delay(700);

   enemyWeakened=true;

   let sludge=attackPower+10;

   enemyHp=Math.max(0,enemyHp-sludge);

   writeLog("ヘドロ攻撃！");
   writeLog(sludge+"ダメージ！");
   writeLog("敵の攻撃力が低下した！");

   updateEnemy();

   break;

  case "K":

   writeLog("黒木「俺はここにいない」");
   await delay(800);

   nullify=true;

   writeLog("欠席発動！次の攻撃を無効化！");

   break;

 }

}

// ==================================
// 高瀬の能力「一番好き」
// ==================================

async function useFavorite(){

 if(selected.id!=="TY")return;

 writeLog("高瀬「……ここが、俺の一番好きな場所だ」");

 await delay(900);

 writeLog("周囲の景色が変わり始める……");

 await delay(900);

 writeLog("校舎の景色が広がった。");
 writeLog("「一番好き」発動！");
 writeLog("この空間では、高瀬に有利な現象が起こる。");

 favoriteTurns=3;

 updateStatus();

}

// ==================================
// 敵のターン
// ==================================

async function enemyTurn(){

 if(enemyHp<=0)return false;

 writeLog("敵が攻撃の準備をしている……");

 await delay(900);

 writeLog(stages[stageIndex].enemy+"の攻撃！");

 await delay(650);

 let damage=enemyPower+Math.floor(Math.random()*6);

 // 敵の特殊能力
 switch(stageIndex){

  case 0:

   if(enemyHp<enemyMaxHp*0.4){

    damage+=8;
    writeLog("上村の攻撃力が上昇している！");

   }

   break;

  case 1:

   if(Math.random()<0.4){

    writeLog("今村「一手先は読めている」");

    if(predicted||nullify){

     writeLog("こちらの能力で攻撃を回避した！");

    }else{

     damage=Math.floor(damage*0.7);
     writeLog("攻撃を読んで威力を抑えた！");

    }

   }

   break;

  case 2:

   if(Math.random()<0.4){

    writeLog("松浦「ヘドロ化！」");
    damage+=5;

    writeLog("ヘドロが身体にまとわりつく！");

   }

   break;

  case 3:

   if(Math.random()<0.35){

    writeLog("黒木「欠席」");

    if(!nullify&&!predicted){

     writeLog("黒木の能力で次の攻撃が封じられる！");
     playerSealed=true;

    }

   }

   break;

  case 4:

   if(Math.random()<0.45){

    writeLog("黒木「強制出席！」");
    damage=Math.floor(damage*1.8);

   }

   break;

 }

 // 松浦の弱体化
 if(enemyWeakened){

  damage=Math.floor(damage*0.5);
  enemyWeakened=false;

  writeLog("ヘドロの効果で敵の攻撃力が低下！");

 }

 // 防御・回避・無効化
 if(nullify){

  damage=0;
  nullify=false;

  writeLog("攻撃を無効化した！");

 }
 else if(predicted){

  damage=0;
  predicted=false;

  writeLog("一手先！攻撃を完全回避！");

 }
 else if(guarding){

  damage=Math.ceil(damage*0.5);
  guarding=false;

  writeLog("防御成功！ダメージ半減！");

 }

 // 黒木の欠席による攻撃封印
 if(playerSealed){

  playerSealed=false;
  damage=0;

  writeLog("存在を消され、攻撃を受けなかった！");

 }

 // 一番好きの防御効果
 if(damage>0&&favoriteTurns>0){

  damage=Math.ceil(damage*0.5);

  writeLog("「一番好き」の空間が攻撃を弱めた！");

 }

 if(damage>0){

  hp=Math.max(0,hp-damage);

  writeLog(damage+"ダメージを受けた！");

 }

 // 一番好きの効果時間を減らす
 if(favoriteTurns>0){

  favoriteTurns--;

  if(favoriteTurns===0){

   writeLog("「一番好き」の空間が消えていく……");

  }

 }

 updateStatus();

 await delay(500);

 if(hp<=0){

  defeat();
  return false;

 }

 return true;

}

// ==================================
// 勝利
// ==================================

async function victory(){

 setBusy(true);

 battleStarted=false;

 await delay(500);

 writeLog("敵を撃破した！");

 await delay(700);

 exp+=40+stageIndex*20;

 if(exp>=60){

  exp-=60;

  level++;

  maxHp+=15;
  maxMp+=8;
  attackPower+=5;

  hp=Math.min(maxHp,hp+30);
  mp=Math.min(maxMp,mp+20);

  writeLog("レベルアップ！");
  writeLog("Lv."+level+"になった！");

 }

 hp=Math.min(maxHp,hp+20);
 mp=Math.min(maxMp,mp+10);

 updateStatus();

 document.getElementById("battleCommands").classList.add("hidden");
 document.getElementById("enemyArea").classList.add("hidden");

 document.getElementById("resultTitle").textContent="勝利！";

 document.getElementById("resultText").textContent=
 stages[stageIndex].win+
 "\n\nHPとMPが少し回復した。";

 document.getElementById("resultPanel").classList.remove("hidden");

 document.getElementById("nextButton").textContent=
 stageIndex===stages.length-1
 ?"タイトルへ戻る"
 :"次の章へ進む";

}

// ==================================
// 敗北
// ==================================

function defeat(){

 setBusy(true);

 battleStarted=false;

 document.getElementById("battleCommands").classList.add("hidden");

 document.getElementById("resultTitle").textContent="敗北……";

 document.getElementById("resultText").textContent=
 selected.name+"は力尽きた。\n\n再挑戦してみよう。";

 document.getElementById("resultPanel").classList.remove("hidden");

 document.getElementById("nextButton").textContent="再挑戦";

}

// ==================================
// 次のステージ
// ==================================

function nextStage(){

 if(hp<=0){

  hp=maxHp;
  mp=maxMp;

  loadStage();

  return;

 }

 if(stageIndex===stages.length-1){

  location.reload();

  return;

 }

 stageIndex++;

 hp=Math.min(maxHp,hp+25);
 mp=Math.min(maxMp,mp+15);

 loadStage();

}

// ==================================
// 初期化
// ==================================

let playerSealed=false;

createCharacterCards();

</script>
