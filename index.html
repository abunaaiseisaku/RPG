
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一番好き - RPG</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #10121a;
    color: #f4f4f4;
    font-family: sans-serif;
}

.container {
    max-width: 750px;
    margin: auto;
}

h1, h2, h3 {
    text-align: center;
}

h1 {
    color: #f5d36b;
    letter-spacing: 4px;
}

.panel {
    background: #202432;
    border: 1px solid #454b60;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.character-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    gap: 10px;
}

.character-card {
    background: #303749;
    border: 2px solid #596078;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
}

.character-card:hover {
    border-color: #f5d36b;
    transform: translateY(-3px);
}

.character-card.selected {
    border-color: #f5d36b;
    background: #48452f;
}

.character-card h3 {
    margin: 5px 0;
    color: #f5d36b;
}

.character-card p {
    font-size: 12px;
    color: #ccc;
}

button {
    background: #4b6cba;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
    margin: 4px;
}

button:hover {
    filter: brightness(1.2);
}

button:disabled {
    background: #555;
    cursor: not-allowed;
}

.main-button {
    background: #c18a35;
    width: 100%;
    font-weight: bold;
    margin-top: 12px;
}

.battle-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.battle-buttons button {
    margin: 0;
    min-height: 48px;
}

.status {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.status-box {
    background: #303749;
    padding: 10px;
    border-radius: 8px;
}

.bar {
    height: 13px;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
}

.hp-bar {
    height: 100%;
    background: #e34e5d;
    transition: width 0.3s;
}

.mp-bar {
    height: 100%;
    background: #4d9be8;
    transition: width 0.3s;
}

.enemy-area {
    text-align: center;
    padding: 15px;
    background: #292d3d;
    border-radius: 10px;
    margin-bottom: 15px;
}

.enemy-name {
    font-size: 23px;
    color: #ff7777;
    font-weight: bold;
}

.enemy-icon {
    font-size: 55px;
    margin: 10px;
}

#log {
    height: 170px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    background: #0b0d13;
    border: 1px solid #555;
    border-radius: 8px;
    text-align: left;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}

.log-entry {
    font-size: 14px;
    line-height: 1.7;
    border-bottom: 1px solid #252a38;
    padding: 3px 0;
}

.player-log {
    color: #8fc5ff;
}

.enemy-log {
    color: #ff8585;
}

.system-log {
    color: #f5d36b;
}

.hidden {
    display: none;
}

.center {
    text-align: center;
}

.small {
    font-size: 12px;
    color: #aaa;
}

.story-text {
    line-height: 1.9;
    white-space: pre-wrap;
    min-height: 100px;
}

#message {
    min-height: 25px;
    text-align: center;
    color: #f5d36b;
    margin: 10px 0;
}

@media(max-width: 420px) {
    body {
        padding: 8px;
    }

    .panel {
        padding: 11px;
    }

    button {
        font-size: 14px;
        padding: 11px 8px;
    }
}
</style>
</head>

<body>
<div class="container">

<h1>一番好き</h1>
<p class="center small">― 能力者たちの物語 ―</p>

<!-- キャラクター選択 -->
<div id="selectScreen" class="panel">
    <h2>主人公を選択</h2>
    <p class="center">5人の中から1人を選んでください。</p>

    <div id="characterList" class="character-list"></div>

    <div id="selectedInfo" class="panel hidden"></div>

    <button id="startButton" class="main-button" disabled onclick="startGame()">
        ゲーム開始
    </button>
</div>

<!-- ストーリー画面 -->
<div id="storyScreen" class="panel hidden">
    <h2 id="chapterTitle"></h2>
    <div id="storyText" class="story-text"></div>
    <button class="main-button" onclick="beginBattle()">戦闘開始</button>
</div>

<!-- バトル画面 -->
<div id="battleScreen" class="hidden">

    <div class="panel">
        <h2 id="battleTitle">BATTLE</h2>

        <div class="enemy-area">
            <div id="enemyIcon" class="enemy-icon">👤</div>
            <div id="enemyName" class="enemy-name"></div>
            <p id="enemyHpText"></p>
            <div class="bar">
                <div id="enemyHpBar" class="hp-bar"></div>
            </div>
        </div>

        <div class="status">
            <div class="status-box">
                <strong id="playerName"></strong>
                <p id="playerLevel"></p>
                <p id="playerHpText"></p>
                <div class="bar">
                    <div id="playerHpBar" class="hp-bar"></div>
                </div>
            </div>

            <div class="status-box">
                <strong>MP</strong>
                <p id="playerMpText"></p>
                <div class="bar">
                    <div id="playerMpBar" class="mp-bar"></div>
                </div>
            </div>
        </div>

        <p id="expText" class="center small"></p>
    </div>

    <div class="panel">
        <h3>コマンド</h3>
        <div class="battle-buttons">
            <button id="attackButton" onclick="playerAction('attack')">
                ⚔️ 攻撃
            </button>

            <button id="skillButton" onclick="playerAction('skill')">
                ✨ 特殊技
            </button>

            <button id="defendButton" onclick="playerAction('defend')">
                🛡️ 防御
            </button>

            <button id="restButton" onclick="playerAction('rest')">
                💠 休憩
            </button>
        </div>

        <p id="skillDescription" class="small center"></p>
        <div id="message"></div>
    </div>

    <div class="panel">
        <h3>バトルログ</h3>
        <div id="log"></div>
        <p class="small center">ログ欄を上下にスワイプして確認できます。</p>
    </div>
</div>

<!-- 勝利・敗北画面 -->
<div id="resultScreen" class="panel hidden">
    <h2 id="resultTitle"></h2>
    <div id="resultText" class="story-text"></div>
    <button id="resultButton" class="main-button" onclick="resultNext()"></button>
</div>

</div>

<script>
const characters = [
    {
        id: "TY",
        name: "高瀬 陽之助",
        type: "バランス型",
        hp: 120,
        mp: 50,
        atk: 22,
        skill: "寝落ち",
        cost: 12,
        description: "次の敵の攻撃を無効化し、HPを20回復する。",
        icon: "😴",
        skillType: "sleep"
    },
    {
        id: "U",
        name: "上村",
        type: "パワー型",
        hp: 155,
        mp: 30,
        atk: 30,
        skill: "かませ犬",
        cost: 15,
        description: "敵に強力な一撃を与える。HP40%未満で攻撃力上昇。",
        icon: "🔥",
        skillType: "power"
    },
    {
        id: "I",
        name: "今村",
        type: "テクニック型",
        hp: 100,
        mp: 65,
        atk: 20,
        skill: "一手先",
        cost: 12,
        description: "次の攻撃を回避し、敵に反撃する。",
        icon: "⚡",
        skillType: "predict"
    },
    {
        id: "M",
        name: "松浦",
        type: "特殊型",
        hp: 135,
        mp: 50,
        atk: 23,
        skill: "ヘドロ",
        cost: 15,
        description: "敵を攻撃し、敵の攻撃力を下げる。",
        icon: "🟣",
        skillType: "mud"
    },
    {
        id: "K",
        name: "黒木",
        type: "トリッキー型",
        hp: 95,
        mp: 85,
        atk: 19,
        skill: "欠席",
        cost: 20,
        description: "次の敵の攻撃を無効化する。",
        icon: "🌑",
        skillType: "absence"
    }
];

const stages = [
    {
        title: "第1話　始まり",
        enemy: "上村",
        icon: "🔥",
        hp: 110,
        atk: 18,
        exp: 30,
        story:
`いつも通りの日常。
授業が終わり、静かな校舎に残っていた陽之助たち。

しかし、その日だけは違った。

目の前に現れたのは、能力を持つ者だった。

「お前も能力者なのか？」

上村は笑いながら構えた。

こうして、戦いが始まった。`
    },
    {
        title: "第2話　テクニシャン",
        enemy: "今村",
        icon: "⚡",
        hp: 145,
        atk: 22,
        exp: 40,
        story:
`上村との戦いを終えた一行。

その前に現れたのは今村だった。

「その能力、少し借りるね」

今村の指先が光る。

触れた物体の役割を移す能力。
そして、相手が次に決めた行動を読む能力。

簡単には勝てそうにない相手だった。`
    },
    {
        title: "第3話　ヘドロ",
        enemy: "松浦",
        icon: "🟣",
        hp: 180,
        atk: 25,
        exp: 50,
        story:
`次に現れたのは松浦。

「価値を奪う」

触れられたものは泥へと変わっていく。

さらに、地面へ沈める能力まで持っている。

足元が不気味に揺れ始めた。`
    },
    {
        title: "第4話　能力者",
        enemy: "黒木",
        icon: "🌑",
        hp: 210,
        atk: 29,
        exp: 65,
        story:
`すべての戦いの裏にいた黒木。

黒木の能力は「欠席」。
自分の存在を認識させなくする。

そして「出席」。
認識した存在を戦場へ引きずり込む。

黒木は静かに言った。

「ここまで来たことを後悔させてやる」`
    },
    {
        title: "最終話　一番好き",
        enemy: "黒木・最終形態",
        icon: "👁️",
        hp: 280,
        atk: 34,
        exp: 100,
        story:
`黒木との最後の戦い。

「お前の存在を消してやる」

黒木の力が校舎全体を包み込む。

しかし、陽之助は立ち上がった。

自分が一番好きだと思った場所。
その場所全体を、自分に都合のよい空間へと変える能力。

「一番好き」

最後の戦いが始まる。`
    }
];

let selectedCharacter = null;
let player = null;
let enemy = null;
let stageIndex = 0;
let busy = false;
let guarding = false;
let nullify = false;
let predicted = false;
let enemyAttackDown = false;
let currentResult = "";

function $(id) {
    return document.getElementById(id);
}

function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// キャラクター選択画面
function createCharacterCards() {
    const list = $("characterList");

    characters.forEach((c, index) => {
        const card = document.createElement("div");
        card.className = "character-card";
        card.innerHTML = `
            <div style="font-size:35px">${c.icon}</div>
            <h3>${c.name}</h3>
            <p>${c.type}</p>
            <p>HP ${c.hp} / MP ${c.mp}</p>
            <p>攻撃力 ${c.atk}</p>
            <p>特殊技：${c.skill}</p>
        `;

        card.onclick = () => selectCharacter(index);
        list.appendChild(card);
    });
}

function selectCharacter(index) {
    selectedCharacter = characters[index];

    document.querySelectorAll(".character-card").forEach((card, i) => {
        card.classList.toggle("selected", i === index);
    });

    $("selectedInfo").classList.remove("hidden");
    $("selectedInfo").innerHTML = `
        <h3>${selectedCharacter.name}</h3>
        <p>タイプ：${selectedCharacter.type}</p>
        <p>HP：${selectedCharacter.hp}</p>
        <p>MP：${selectedCharacter.mp}</p>
        <p>攻撃力：${selectedCharacter.atk}</p>
        <p>特殊技：${selectedCharacter.skill}</p>
        <p>${selectedCharacter.description}</p>
    `;

    $("startButton").disabled = false;
}

function startGame() {
    if (!selectedCharacter) return;

    player = {
        ...selectedCharacter,
        maxHp: selectedCharacter.hp,
        maxMp: selectedCharacter.mp,
        level: 1,
        exp: 0,
        nextExp: 50
    };

    stageIndex = 0;
    $("selectScreen").classList.add("hidden");

    loadStage();
}

function loadStage() {
    busy = false;
    guarding = false;
    nullify = false;
    predicted = false;
    enemyAttackDown = false;

    const stage = stages[stageIndex];

    $("storyScreen").classList.remove("hidden");
    $("battleScreen").classList.add("hidden");
    $("resultScreen").classList.add("hidden");

    $("chapterTitle").textContent = stage.title;
    $("storyText").textContent = stage.story;
}

function beginBattle() {
    const stage = stages[stageIndex];

    enemy = {
        name: stage.enemy,
        icon: stage.icon,
        hp: stage.hp,
        maxHp: stage.hp,
        atk: stage.atk
    };

    $("storyScreen").classList.add("hidden");
    $("battleScreen").classList.remove("hidden");

    $("battleTitle").textContent = stage.title;
    $("enemyName").textContent = enemy.name;
    $("enemyIcon").textContent = enemy.icon;
    $("skillDescription").textContent =
        `${player.skill}（MP ${player.cost}）：${player.description}`;

    $("log").innerHTML = "";
    addLog(`${enemy.name}が現れた！`, "system-log");
    addLog("どうする？", "system-log");

    updateStatus();
    setButtons(true);
}

function addLog(text, type = "") {
    const log = $("log");
    const entry = document.createElement("div");

    entry.className = "log-entry " + type;
    entry.textContent = text;

    log.appendChild(entry);

    // 新しいログが追加されたら最下部へ移動
    log.scrollTop = log.scrollHeight;
}

function updateStatus() {
    $("playerName").textContent = player.name;
    $("playerLevel").textContent = `Lv.${player.level}`;
    $("playerHpText").textContent =
        `HP：${Math.max(0, player.hp)} / ${player.maxHp}`;

    $("playerMpText").textContent =
        `MP：${player.mp} / ${player.maxMp}`;

    $("playerHpBar").style.width =
        Math.max(0, player.hp / player.maxHp * 100) + "%";

    $("playerMpBar").style.width =
        Math.max(0, player.mp / player.maxMp * 100) + "%";

    $("enemyHpText").textContent =
        `HP：${Math.max(0, enemy.hp)} / ${enemy.maxHp}`;

    $("enemyHpBar").style.width =
        Math.max(0, enemy.hp / enemy.maxHp * 100) + "%";

    $("expText").textContent =
        `EXP：${player.exp} / ${player.nextExp}`;
}

function setButtons(enabled) {
    $("attackButton").disabled = !enabled;
    $("skillButton").disabled = !enabled;
    $("defendButton").disabled = !enabled;
    $("restButton").disabled = !enabled;
}

async function playerAction(type) {
    if (busy || !player || !enemy) return;

    busy = true;
    setButtons(false);

    if (type === "attack") {
        let damage = player.atk;

        if (player.id === "U" &&
            player.hp < player.maxHp * 0.4) {
            damage = Math.floor(damage * 1.5);
            addLog("かませ犬の能力が発動！攻撃力上昇！", "system-log");
        }

        enemy.hp -= damage;
        addLog(`${player.name}の攻撃！ ${damage}ダメージ！`, "player-log");

    } else if (type === "skill") {
        if (player.mp < player.cost) {
            addLog("MPが足りない！", "system-log");
            busy = false;
            setButtons(true);
            return;
        }

        player.mp -= player.cost;
        await useSkill();

    } else if (type === "defend") {
        guarding = true;
        addLog(`${player.name}は防御の構えをとった！`, "player-log");

    } else if (type === "rest") {
        const recovery = 15;
        player.mp = Math.min(player.maxMp, player.mp + recovery);
        addLog(`MPが${recovery}回復した！`, "player-log");
    }

    updateStatus();

    if (enemy.hp <= 0) {
        enemy.hp = 0;
        updateStatus();
        await delay(700);
        victory();
        return;
    }

    // プレイヤーの行動と敵の反撃の間に演出時間
    await delay(1000);

    await enemyTurn();

    if (player.hp <= 0) {
        player.hp = 0;
        updateStatus();
        await delay(500);
        defeat();
        return;
    }

    updateStatus();
    busy = false;
    setButtons(true);
}

async function useSkill() {
    switch (player.skillType) {

        case "sleep":
            nullify = true;
            player.hp = Math.min(player.maxHp, player.hp + 20);
            addLog("寝落ち！次の攻撃を無効化する！", "player-log");
            addLog("HPが20回復した！", "system-log");
            break;

        case "power": {
            let damage = 55 + player.level * 3;
            if (player.hp < player.maxHp * 0.4) {
                damage = Math.floor(damage * 1.3);
            }
            enemy.hp -= damage;
            addLog(`かませ犬！ ${damage}ダメージ！`, "player-log");
            break;
        }

        case "predict": {
            predicted = true;
            const damage = Math.floor(player.atk * 1.5);
            enemy.hp -= damage;
            addLog("一手先！敵の行動を読んだ！", "player-log");
            addLog(`${damage}ダメージ！`, "player-log");
            break;
        }

        case "mud": {
            const damage = 35 + player.level * 2;
            enemy.hp -= damage;
            enemyAttackDown = true;
            addLog(`ヘドロ！ ${damage}ダメージ！`, "player-log");
            addLog("敵の攻撃力が低下した！", "system-log");
            break;
        }

        case "absence":
            nullify = true;
            addLog("欠席！自分の存在を消した！", "player-log");
            addLog("次の攻撃を無効化する！", "system-log");
            break;
    }

    updateStatus();
}

async function enemyTurn() {
    addLog(`${enemy.name}のターン！`, "system-log");

    await delay(650);

    if (predicted) {
        predicted = false;
        addLog("攻撃を完全に読んでいた！", "player-log");

        const counterDamage = Math.floor(player.atk * 1.2);
        enemy.hp -= counterDamage;

        addLog(`反撃！ ${counterDamage}ダメージ！`, "player-log");
        updateStatus();
        return;
    }

    if (nullify) {
        nullify = false;
        addLog("攻撃は無効化された！", "player-log");
        return;
    }

    let damage = enemy.atk;

    if (enemyAttackDown) {
        damage = Math.floor(damage * 0.6);
        enemyAttackDown = false;
    }

    if (guarding) {
        damage = Math.floor(damage * 0.5);
        guarding = false;
        addLog("防御によってダメージを軽減！", "system-log");
    }

    player.hp -= damage;
    addLog(`${enemy.name}の攻撃！ ${damage}ダメージ！`, "enemy-log");

    updateStatus();
}

function victory() {
    busy = true;
    setButtons(false);

    const stage = stages[stageIndex];

    player.exp += stage.exp;

    let levelMessage = "";

    while (player.exp >= player.nextExp) {
        player.exp -= player.nextExp;
        player.level++;
        player.nextExp = Math.floor(player.nextExp * 1.4);

        player.maxHp += 15;
        player.maxMp += 8;
        player.atk += 4;

        player.hp = Math.min(player.maxHp, player.hp + 25);
        player.mp = Math.min(player.maxMp, player.mp + 15);

        levelMessage += `\nレベルアップ！ Lv.${player.level}`;
    }

    $("battleScreen").classList.add("hidden");
    $("resultScreen").classList.remove("hidden");

    $("resultTitle").textContent = "VICTORY！";
    $("resultText").textContent =
        `${enemy.name}に勝利した！\n経験値 ${stage.exp} を獲得！${levelMessage}`;

    if (stageIndex === stages.length - 1) {
        $("resultText").textContent +=
            `\n\nすべての戦いが終わった。\n\n陽之助は静かに眠り続けた。\n\n翌朝、校舎は閉鎖され、記録は消えていた。\n\n机の上には、こう書かれていた。\n\n「俺は、ここが一番好きだった。」`;

        $("resultButton").textContent = "最初に戻る";
        currentResult = "clear";
    } else {
        $("resultButton").textContent = "次の章へ";
        currentResult = "next";
    }
}

function defeat() {
    busy = true;
    setButtons(false);

    $("battleScreen").classList.add("hidden");
    $("resultScreen").classList.remove("hidden");

    $("resultTitle").textContent = "DEFEAT...";
    $("resultText").textContent =
        `${player.name}は倒れてしまった。\n\nもう一度挑戦することができる。`;

    $("resultButton").textContent = "再挑戦";
    currentResult = "retry";
}

function resultNext() {
    if (currentResult === "clear") {
        location.reload();
        return;
    }

    if (currentResult === "retry") {
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        loadStage();
        return;
    }

    if (currentResult === "next") {
        stageIndex++;

        // 次の章ではHP・MPを少し回復
        player.hp = Math.min(player.maxHp, player.hp + 30);
        player.mp = Math.min(player.maxMp, player.mp + 15);

        loadStage();
    }
}

createCharacterCards();
</script>
