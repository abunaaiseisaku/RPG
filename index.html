<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一番好き RPG</title>
<style>
*{box-sizing:border-box}
body{
 background:#111827;color:white;font-family:sans-serif;
 margin:0;padding:15px;text-align:center
}
h1{color:#ffd166}
.box{
 background:#202c40;border:1px solid #52647d;
 border-radius:15px;padding:16px;margin:12px auto;
 max-width:650px
}
button{
 background:#3478ad;color:white;border:0;
 padding:13px;border-radius:9px;font-size:15px;
 font-weight:bold;cursor:pointer;margin:4px
}
button:disabled{opacity:.4}
button.special{background:#986b27}
button.danger{background:#9b3947}
button:active{transform:scale(.97)}
.bar{height:13px;background:#45536a;border-radius:10px;overflow:hidden;margin:5px 0 12px}
.fill{height:100%;transition:width .3s}
.hp{background:#ff6577}
.mp{background:#55aaff}
#story{line-height:1.9;white-space:pre-line;min-height:100px}
#log{
 background:#0d1421;padding:12px;border-radius:10px;
 text-align:left;min-height:100px;line-height:1.8
}
.enemy{font-size:25px;color:#ffca8a;font-weight:bold}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actions button{width:100%;margin:0}
.hidden{display:none}
</style>
</head>
<body>

<h1>『一番好き』</h1>
<p>群馬高専・能力者編 RPG</p>

<div class="box" id="start">
<h2>プロローグ</h2>
<p id="story">
群馬高専には奇妙な噂がある。

――この学校には能力者がいる。

よく眠る学生、T.Y.。
ある日、学校を揺るがす戦いに巻き込まれる。
</p>
<button onclick="begin()">ゲーム開始</button>
</div>

<div id="game" class="hidden">

<div class="box">
<h3 id="chapter">第1話 群馬高専</h3>
<div>T.Y.　Lv.<span id="lv">1</span></div>
HP <span id="hpText"></span>
<div class="bar"><div id="hpBar" class="fill hp"></div></div>
MP <span id="mpText"></span>
<div class="bar"><div id="mpBar" class="fill mp"></div></div>
経験値 <span id="exp">0</span>
</div>

<div class="box">
<h2 id="scene">戦闘開始</h2>
<div id="storyText"></div>
<br>
<div id="enemyArea" class="hidden">
<div class="enemy" id="enemyName"></div>
<p id="enemyDesc"></p>
HP <span id="enemyHp"></span>
<div class="bar"><div id="enemyBar" class="fill hp"></div></div>
</div>
</div>

<div class="box">
<h3>コマンド</h3>
<div class="actions" id="commands">
<button onclick="attack()">通常攻撃</button>
<button onclick="guard()">防御</button>
<button class="special" onclick="sleep()">寝落ち</button>
<button class="special" onclick="favorite()">一番好き</button>
</div>
</div>

<div class="box">
<h3>バトルログ</h3>
<div id="log"></div>
</div>

<div class="box hidden" id="result">
<h2 id="resultTitle">勝利！</h2>
<p id="resultText"></p>
<button onclick="next()">次へ進む</button>
</div>

</div>

<script>
const chapters=[
{
name:"第1話 群馬高専",
enemy:"U.",
desc:"能力：かませ犬。追い詰められるほど強くなる。",
hp:75,power:10,
story:"校舎が揺れた。\nU.「今日から、この学校は俺のものだ」\n\nT.Y.の前に、強敵が立ちはだかる。",
win:"U.は吹き飛ばされた。しかし、背後からI.が現れた。"
},
{
name:"第2話 テクニシャン",
enemy:"I.",
desc:"能力：一手先。相手の次の行動を読む。",
hp:100,power:13,
story:"I.「君の行動はすべて読める」\n\n飛び交う文房具。T.Y.は攻撃を避けられない。",
win:"眠っている間、I.の先読みは機能しなかった。T.Y.は寝落ちの能力を習得した。"
},
{
name:"第3話 ヘドロ",
enemy:"M.",
desc:"能力：価値を奪う。触れたものを泥に変える。",
hp:130,power:16,
story:"床が黒い泥に変わっていく。\nM.「この学校全部を泥にしてやる」",
win:"M.を撃破。寝落ちの力が強化された。"
},
{
name:"第4話 能力者",
enemy:"K.",
desc:"能力：欠席。存在を認識から消す。",
hp:160,power:20,
story:"K.「全員、戦え」\n\n能力者たちが集結する。校舎が崩れ始めた。",
win:"K.を追い詰めた。T.Y.の能力の正体が明らかになる。"
},
{
name:"最終話 一番好き",
enemy:"K. 最終形態",
desc:"能力：存在そのものを消し去る。",
hp:230,power:25,
story:"K.「お前はここで消える」\n\nT.Y.「俺、ここが一番好きだから」",
win:"K.の能力が崩壊した。\n\nT.Y.「もう疲れた。寝る」\n\n翌朝、学校には誰もいなかった。\n机の上には一行だけ残されていた。\n\n『俺は、ここが一番好きだった。』"
}
];

let stage=0,hp=120,maxHp=120,mp=40,maxMp=40;
let lv=1,exp=0,enemyHp=0,enemyMax=0;
let defending=false,invincible=false,busy=false;

function begin(){
 document.getElementById("start").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 loadStage();
}

function loadStage(){
 const c=chapters[stage];
 document.getElementById("chapter").textContent=c.name;
 document.getElementById("scene").textContent="VS "+c.enemy;
 document.getElementById("storyText").textContent=c.story;
 document.getElementById("enemyArea").classList.remove("hidden");
 document.getElementById("enemyName").textContent=c.enemy;
 document.getElementById("enemyDesc").textContent=c.desc;
 enemyHp=enemyMax=c.hp;
 defending=false;invincible=false;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("commands").classList.remove("hidden");
 log("戦闘開始！ "+c.enemy+" が現れた！");
 update();
}

function log(t){
 let l=document.getElementById("log");
 let p=document.createElement("p");
 p.textContent=t;
 l.appendChild(p);
 l.scrollTop=l.scrollHeight;
}

function update(){
 document.getElementById("hpText").textContent=hp+"/"+maxHp;
 document.getElementById("mpText").textContent=mp+"/"+maxMp;
 document.getElementById("hpBar").style.width=hp/maxHp*100+"%";
 document.getElementById("mpBar").style.width=mp/maxMp*100+"%";
 document.getElementById("enemyHp").textContent=enemyHp+"/"+enemyMax;
 document.getElementById("enemyBar").style.width=enemyHp/enemyMax*100+"%";
 document.getElementById("lv").textContent=lv;
 document.getElementById("exp").textContent=exp;
}

function disableActions(){
 busy=true;
 document.querySelectorAll("#commands button").forEach(b=>b.disabled=true);
}
function enableActions(){
 busy=false;
 document.querySelectorAll("#commands button").forEach(b=>b.disabled=false);
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}

async function attack(){
 if(busy)return;
 disableActions();
 let damage=20+lv*3;
 log("T.Y.の攻撃！");
 await wait(500);
 enemyHp=Math.max(0,enemyHp-damage);
 log(damage+" ダメージ！");
 update();
 await wait(650);
 await enemyTurn();
}

async function guard(){
 if(busy)return;
 disableActions();
 defending=true;
 log("T.Y.は身構えた！");
 await wait(500);
 await enemyTurn();
}

async function sleep(){
 if(busy||mp<10||stage===0)return;
 disableActions();
 mp-=10;
 invincible=true;
 hp=Math.min(maxHp,hp+20);
 log("T.Y.「……寝る」");
 update();
 await wait(1000);
 log("T.Y.は深い眠りに落ちた……");
 await wait(700);
 log("寝落ち発動！次の攻撃を無効化！");
 await enemyTurn();
}

async function favorite(){
 if(busy||mp<20||stage<3)return;
 disableActions();
 mp-=20;
 let damage=stage===4?95:65;
 log("T.Y.「ここが一番好き」");
 await wait(800);
 log("『一番好き』発動！");
 await wait(500);
 enemyHp=Math.max(0,enemyHp-damage);
 log(damage+" ダメージ！");
 update();
 await wait(700);
 await enemyTurn();
}

async function enemyTurn(){
 if(enemyHp<=0){win();return}
 await wait(400);
 log(chapters[stage].enemy+"の攻撃！");
 await wait(650);

 let damage=chapters[stage].power+Math.floor(Math.random()*6);
 if(stage===0&&enemyHp<enemyMax/2)damage+=8;

 if(invincible){
  damage=0;invincible=false;
  log("攻撃が無効化された！");
 }else if(defending){
  damage=Math.ceil(damage/2);
  defending=false;
  log("防御成功！ダメージ半減！");
 }
 if(damage>0){
  hp=Math.max(0,hp-damage);
  log("T.Y.は"+damage+"ダメージを受けた！");
 }
 update();
 await wait(500);

 if(hp<=0){
  defeat();
  return;
 }
 enableActions();
}

async function win(){
 busy=true;
 document.getElementById("commands").classList.add("hidden");
 log("敵を撃破した！");
 await wait(700);
 exp+=40+stage*20;
 if(exp>=60){
  exp=0;lv++;maxHp+=15;maxMp+=5;
  hp=Math.min(maxHp,hp+30);
  mp=Math.min(maxMp,mp+15);
  log("レベルアップ！ Lv."+lv);
 }
 hp=Math.min(maxHp,hp+20);
 mp=Math.min(maxMp,mp+10);
 update();
 document.getElementById("resultTitle").textContent="勝利！";
 document.getElementById("resultText").textContent=chapters[stage].win;
 document.getElementById("result").classList.remove("hidden");
 document.querySelector("#result button").textContent=
 stage===4?"タイトルへ戻る":"次の章へ進む";
}

function defeat(){
 busy=true;
 document.getElementById("commands").classList.add("hidden");
 document.getElementById("resultTitle").textContent="敗北……";
 document.getElementById("resultText").textContent="T.Y.は倒れてしまった。もう一度挑戦しよう。";
 document.getElementById("result").classList.remove("hidden");
 document.querySelector("#result button").textContent="再挑戦";
}

function next(){
 if(hp<=0){
  hp=maxHp;mp=maxMp;loadStage();return;
 }
 if(stage===4){
  location.reload();return;
 }
 stage++;
 hp=Math.min(maxHp,hp+25);
 mp=Math.min(maxMp,mp+15);
 loadStage();
}
</script>
</body>
</html>
