<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秘密の夜のチャット</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#17121b;color:white;
  font-family:sans-serif;
}
.app{
  max-width:500px;margin:auto;height:100dvh;
  display:flex;flex-direction:column;
  background:#211a27;
}
header{
  padding:16px;background:#302336;
  text-align:center;font-weight:bold;
}
.profile{
  padding:12px;text-align:center;
  background:#281e30;
}
.name{font-size:21px;color:#ff9dc9}
.status{font-size:12px;color:#aaa;margin-top:5px}
.meter{
  height:8px;background:#514252;
  border-radius:10px;margin-top:10px;overflow:hidden;
}
.bar{
  height:100%;width:20%;background:#f16ba9;
  transition:width .4s;
}
.chat{
  flex:1;overflow-y:auto;padding:15px;
}
.msg{
  max-width:85%;padding:12px 15px;
  border-radius:15px;margin:12px 0;
  line-height:1.6;white-space:pre-wrap;
  animation:appear .3s;
}
@keyframes appear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.left{background:#49364e;margin-right:auto}
.right{background:#a33e77;margin-left:auto}
.label{font-size:11px;color:#ffafd5;margin-bottom:4px}
.choices{padding:12px;background:#302336}
.choice{
  display:block;width:100%;padding:14px;
  margin:7px 0;border:1px solid #b75b91;
  border-radius:12px;background:#432b40;
  color:white;font-size:14px;
}
.choice:active{background:#85436b}
.choice:disabled{opacity:.5}
footer{text-align:center;padding:8px;color:#aaa;font-size:11px}
</style>
</head>
<body>
<div class="app">
<header>🌙 秘密の夜のチャット</header>

<div class="profile">
  <div class="name">玲奈 ♡</div>
  <div class="status" id="status">あなたとの距離：知り合い</div>
  <div class="meter"><div class="bar" id="bar"></div></div>
  <div style="font-size:12px;margin-top:5px">
    好感度：<span id="score">20</span> / 100
  </div>
</div>

<div class="chat" id="chat">
  <div class="msg left">
    <div class="label">玲奈</div>
    こんばんは♡
    こんな時間まで起きてるなんて珍しいね。
    私？ちょうどあなたに連絡しようと思ってたところ♪
  </div>
</div>

<div class="choices" id="choices"></div>
<footer>この物語はフィクションです</footer>
</div>

<script>
let affection=20;
let step=0;
let ended=false;

const chat=document.getElementById("chat");
const choices=document.getElementById("choices");

const story=[
{
 text:"ふふ、そう言ってくれると嬉しいな♡\nねえ、私のことどう思ってる？",
 options:[
 ["かわいいと思ってるよ♡",15,
 "えっ……急にそんなこと言うの？照れるじゃん♡"],
 ["話していて楽しいよ",10,
 "本当？私もあなたと話すの好きだよ♪"],
 ["まだよく分からないかな",0,
 "そっか。じゃあ、これから知っていってね！"]
 ]
},
{
 text:"ねえ、もし今私が隣にいたらどうする？",
 options:[
 ["手をつないでみたい",15,
 "……想像したら、なんだかドキドキしてきた♡"],
 ["一緒に映画を見たい",10,
 "いいね！二人でゆっくり過ごしたいな♪"],
 ["普通におしゃべりする",5,
 "ふふ、それも楽しそうだね！"]
 ]
},
{
 text:"実はね、今日は少し寂しかったんだ。\nあなたと話せてよかった。",
 options:[
 ["いつでも話を聞くよ",15,
 "ありがとう……あなたって本当に優しいね♡"],
 ["今度一緒に出かけよう",15,
 "えっ！それってデートのお誘い？♡"],
 ["元気出して！",5,
 "ふふ、ありがとう！元気になったよ！"]
 ]
},
{
 text:"最後にひとつ聞いてもいい？\n私ともっと仲良くなりたい？",
 options:[
 ["もちろん。もっと一緒にいたい",20,
 "……嬉しい。私もあなたともっと一緒にいたい♡"],
 ["ゆっくり仲良くなろう",10,
 "うん！焦らずに、二人のペースでね♪"],
 ["まだ考え中かな",0,
 "そっか！これからもっとお互いを知ろうね。"]
 ]
}
];

function update(){
 document.getElementById("score").textContent=affection;
 document.getElementById("bar").style.width=affection+"%";

 let status="知り合い";
 if(affection>=80)status="特別な存在♡";
 else if(affection>=60)status="かなり親しい";
 else if(affection>=40)status="友達以上？";

 document.getElementById("status").textContent=
 "あなたとの距離："+status;
}

function message(who,text){
 const div=document.createElement("div");
 div.className="msg "+(who==="me"?"right":"left");
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function showOptions(){
 choices.innerHTML="";
 const current=story[step];

 current.options.forEach((option)=>{
  const button=document.createElement("button");
  button.className="choice";
  button.textContent=option[0];

  button.onclick=()=>{
   if(ended)return;

   message("me",option[0]);
   affection=Math.max(0,Math.min(100,affection+option[1]));
   update();

   choices.innerHTML="";

   setTimeout(()=>{
    message("her",option[2]);
    step++;

    if(step>=story.length){
      setTimeout(ending,800);
    }else{
      setTimeout(()=>{
       message("her",story[step].text);
       showOptions();
      },900);
    }
   },1000);
  };
  choices.appendChild(button);
 });
}

function ending(){
 ended=true;
 let result;
 let title;

 if(affection>=80){
  title="♡ 特別な関係エンド ♡";
  result="「ねえ……今度はチャットじゃなくて、直接会いたいな。あなたと過ごす時間が、私の一番の楽しみになっちゃった♡」";
 }else if(affection>=55){
  title="♡ 恋の予感エンド ♡";
  result="「もっとあなたのことを知りたいな。これからもいっぱいお話ししようね！」";
 }else{
  title="🌙 友達エンド";
  result="「今日は楽しかったよ！またいつでも連絡してね♪」";
 }

 message("her",title+"\n"+result);

 choices.innerHTML="";
 const button=document.createElement("button");
 button.className="choice";
 button.textContent="もう一度遊ぶ";
 button.onclick=()=>location.reload();
 choices.appendChild(button);
}

update();
showOptions();
</script>
</body>
</html>
